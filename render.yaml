services:
  - type: web
    name: beeware-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        value: beeware_secret_key_default
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
